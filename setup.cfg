[metadata]
name = AIPairProgrammer
version = 0.0.1
author = Randall Morgan
author_email = rmorgan@sensornet.us
description = Experimental PyQt5 desktop assistant for programming questions
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Monotoba/ai-pair-programmer
project_urls =
    Bug Tracker = https://github.com/Monotoba/ai-pair-programmer/issues
classifiers =
    Development Status :: 2 - Pre-Alpha
    Programming Language :: Python :: 3
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
license_files = LICENSE.md

[options]
packages = find:
python_requires = >=3.10
install_requires =
    openai>=0.27.4,<0.28
    PyQt5>=5.15.9,<6

[options.packages.find]
include = aipairprogrammer*
exclude = aipairprogrammer.test*

[options.extras_require]
test =
    pytest>=7,<10
    pytest-qt>=4,<5

[options.entry_points]
gui_scripts =
    ai-pair-programmer = aipairprogrammer.__main__:main
